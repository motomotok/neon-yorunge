name: Deploy GitHub Pages

# Tek kaynak: www/ klasörü. Android/iOS (Capacitor) build'i de aynı klasörü
# kullanıyor — burada ayrıca kökte bir kopya tutmuyoruz. www/ değiştiğinde
# bu workflow onu doğrudan (kök yol olarak, /www/ önekiyle DEĞİL) siteye
# yayınlar; paslagame.com.tr her zaman www/index.html'in temiz URL hali
# olarak kalır.

on:
  push:
    branches: [main]
    paths: ['www/**', 'siteler/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Beat Orbit www/ kokte; siteler/ altindaki oyunlar kendi alt yolunda.
      # siteler/ www/ disinda durur ki Android/iOS derlemesine girmesin.
      - run: |
          mkdir _site
          cp -a www/. _site/
          cp -a siteler/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
