workflows:
  ios-testflight:
    name: iOS — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups: []
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.motomotok.neonyorunge"
      node: 20.11.1
      xcode: latest
      cocoapods: default
      # NOT: "ios_signing" bloğu BİLEREK yok — o blok varken Codemagic script'ler
      # hiç çalışmadan ÖNCE kendi otomatik bir sertifika/profil kontrolü
      # yapıyor; bu kontrol var olanı arıyor ama YENİ oluşturmuyor. Hesapta
      # henüz hiç App Store dağıtım sertifikası olmadığı için o otomatik
      # kontrol hep aynı "no matching profiles" hatasıyla anında düşüyor —
      # aşağıdaki scriptler (ki onlar --create ile gerçekten oluşturuyor) hiç
      # çalışma şansı bulamıyordu. İmzalamayı tamamen scriptlere bırakıyoruz.
    integrations:
      # Codemagic panelinde oluşturduğun key'in ADI (Settings -> Integrations
      # -> Developer Portal -> Manage keys -> Active listesindeki "NAME"
      # sütunu) buradakiyle birebir aynı olmalı.
      app_store_connect: "Codemagic CI"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build ads bundle & sync Capacitor iOS project
        script: |
          # www/native-ads-bundle.js ve ios/App/App/public/ ikisi de .gitignore'da
          # (kaynak değil, üretilen dosyalar) — bu yüzden her CI derlemesinde
          # burada YENİDEN üretilmeleri şart, yoksa Xcode eski/boş bir web
          # klasörü paketler.
          npm run build:ads
          # "cap sync ios" kendi içinde "pod install" da çalıştırıyor; bu adım
          # Google-Mobile-Ads-SDK'yı dl.google.com'dan indiriyor ve CI
          # makineleriyle Google'ın CDN'i arasında ara sıra geçici ağ zaman
          # aşımı yaşanabiliyor (bizim ayarımızla ilgili değil) — bu yüzden
          # 3 denemeye kadar otomatik tekrar deniyoruz.
          n=0
          until npx cap sync ios; do
            n=$((n+1))
            if [ $n -ge 3 ]; then echo "cap sync ios 3 denemede de başarısız oldu."; exit 1; fi
            echo "cap sync ios başarısız (deneme $n/3) — 15sn sonra tekrar denenecek..."
            sleep 15
          done
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          n=0
          until pod install; do
            n=$((n+1))
            if [ $n -ge 3 ]; then echo "pod install 3 denemede de başarısız oldu."; exit 1; fi
            echo "pod install başarısız (deneme $n/3) — 15sn sonra tekrar denenecek..."
            sleep 15
          done
      - name: Set up keychain
        script: |
          # SIRA ÖNEMLİ: "fetch-signing-files --create" Apple'da hiç
          # sertifika yoksa YENİ bir sertifika + özel anahtar (private key)
          # ÜRETİYOR ve onu bir keychain'e kaydetmesi gerekiyor. Keychain bu
          # adımdan ÖNCE hazır değilse "Cannot save Signing Certificates
          # without certificate private key" hatası veriyor — bu yüzden
          # keychain'i fetch'ten ÖNCE kuruyoruz (önceki denemede sıra tersti).
          keychain initialize
      - name: Fetch signing files
        script: |
          # Codemagic'in kendi "fetch-signing-files" kodunu inceledim: --create
          # sertifikayı Apple'da OLUŞTURUYOR ama imzalamak için kullanılacak
          # özel anahtarı (private key) KENDİLİĞİNDEN üretmiyor — bunu bize
          # --certificate-key ile vermemiz gerekiyor, yoksa "Cannot save
          # Signing Certificates without certificate private key" hatası
          # veriyor (önceki 2 denemede kaçırdığım asıl sebep buydu). Önce
          # standart bir RSA anahtarı üretip onu veriyoruz.
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
      - name: Set up signing certificate
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          # Apple'a yollanan her build'in numarası bir öncekinden büyük olmalı;
          # Codemagic'in kendi otomatik artan sayacını (CM_BUILD_NUMBER)
          # kullanmak ekstra App Store Connect API çağrısı gerektirmiyor,
          # en basit ve güvenilir yöntem.
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $CM_BUILD_NUMBER
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - aliaslan625625@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # İlk birkaç build'de kapalı kalması daha güvenli — hazır olunca
        # true yapıp iPhone 11 / iPad mini'nin bağlı olduğu bir Test
        # Grubu adı ekleyebilirsin (App Store Connect -> TestFlight'ta
        # oluşturulur):
        # beta_groups:
        #   - "İç Test"
