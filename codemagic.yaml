workflows:
  ios-testflight:
    name: iOS — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Codemagic panelinde CERTIFICATE_PRIVATE_KEY'i eklerken seçtiğin/
      # oluşturduğun grup adı — buradaki isimle birebir aynı olmalı.
      groups:
        - ios_signing
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.motomotok.neonyorunge"
      node: 20.11.1
      xcode: latest
      cocoapods: default
      # NOT: "ios_signing" bloğu BİLEREK yok — o blok varken Codemagic script'ler
      # hiç çalışmadan ÖNCE kendi otomatik bir sertifika/profil kontrolü
      # yapıyor; bu kontrol var olanı arıyor ama YENİ oluşturmuyor. Hesapta
      # henüz hiç App Store dağıtım sertifikası olmadığı için o otomatik
      # kontrol hep aynı "no matching profiles" hatasıyla anında düşüyor —
      # aşağıdaki scriptler (ki onlar --create ile gerçekten oluşturuyor) hiç
      # çalışma şansı bulamıyordu. İmzalamayı tamamen scriptlere bırakıyoruz.
    integrations:
      # Codemagic panelinde oluşturduğun key'in ADI (Settings -> Integrations
      # -> Developer Portal -> Manage keys -> Active listesindeki "NAME"
      # sütunu) buradakiyle birebir aynı olmalı.
      app_store_connect: "Codemagic CI"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build ads bundle & sync Capacitor iOS project
        script: |
          # www/native-ads-bundle.js ve ios/App/App/public/ ikisi de .gitignore'da
          # (kaynak değil, üretilen dosyalar) — bu yüzden her CI derlemesinde
          # burada YENİDEN üretilmeleri şart, yoksa Xcode eski/boş bir web
          # klasörü paketler.
          npm run build:ads
          npm run build:3d
          # "cap sync ios" kendi içinde "pod install" da çalıştırıyor; bu adım
          # Google-Mobile-Ads-SDK'yı dl.google.com'dan indiriyor ve CI
          # makineleriyle Google'ın CDN'i arasında ara sıra geçici ağ zaman
          # aşımı yaşanabiliyor (bizim ayarımızla ilgili değil) — bu yüzden
          # 3 denemeye kadar otomatik tekrar deniyoruz.
          n=0
          until npx cap sync ios; do
            n=$((n+1))
            if [ $n -ge 3 ]; then echo "cap sync ios 3 denemede de başarısız oldu."; exit 1; fi
            echo "cap sync ios başarısız (deneme $n/3) — 15sn sonra tekrar denenecek..."
            sleep 15
          done
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          n=0
          until pod install; do
            n=$((n+1))
            if [ $n -ge 3 ]; then echo "pod install 3 denemede de başarısız oldu."; exit 1; fi
            echo "pod install başarısız (deneme $n/3) — 15sn sonra tekrar denenecek..."
            sleep 15
          done
      - name: Set up keychain
        script: |
          # SIRA ÖNEMLİ: "fetch-signing-files --create" Apple'da hiç
          # sertifika yoksa YENİ bir sertifika + özel anahtar (private key)
          # ÜRETİYOR ve onu bir keychain'e kaydetmesi gerekiyor. Keychain bu
          # adımdan ÖNCE hazır değilse "Cannot save Signing Certificates
          # without certificate private key" hatası veriyor — bu yüzden
          # keychain'i fetch'ten ÖNCE kuruyoruz (önceki denemede sıra tersti).
          keychain initialize
      - name: Fetch signing files
        script: |
          # ÖNEMLİ: özel anahtar HER build'de yeniden üretilmemeli — ürettikçe
          # Apple'da eşleşen sertifika bulunamıyor, her seferinde YENİ bir
          # sertifika oluşturulmaya çalışılıyor ve Apple'ın hesap başına izin
          # verdiği Distribution sertifika sayısı hızla doluyor (409 hatası
          # buradan geldi). Doğrusu: anahtarı BİR KERE üretip Codemagic'te
          # kalıcı bir ortam değişkeni (CERTIFICATE_PRIVATE_KEY, Secure
          # işaretli) olarak saklamak — her build aynı anahtarı kullanır,
          # aynı sertifikayı bulup yeniden kullanır.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Set up signing certificate
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          # Apple'a yollanan her build'in numarası bir öncekinden büyük olmalı;
          # Codemagic'in kendi otomatik artan sayacını kullanmak ekstra App
          # Store Connect API çağrısı gerektirmiyor, en basit ve güvenilir
          # yöntem. NOT: değişkenin doğru adı BUILD_NUMBER'mış, CM_BUILD_NUMBER
          # diye yazdığım önceki denemede boş geldiği için agvtool'a hiç
          # versiyon numarası gitmemiş, o yüzden komut kendi yardım metnini
          # basıp duruyordu.
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - aliaslan625625@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # false: build işlendikten sonra sadece Internal Testing grubuna
        # (Apple incelemesi GEREKTİRMEZ, anında kullanılabilir) otomatik
        # düşer. true iken Codemagic her build'de ayrıca "External Beta
        # Review"e göndermeyi DENİYORDU — biz sadece kendi Internal Testing
        # hesabımızla (Test) test ettiğimiz için buna hiç gerek yoktu, üstelik
        # bir önceki build Apple'da incelemedeyken yenisi gönderilince
        # "Another build is in review" hatasıyla her seferinde patlıyordu.
        # Gerçek dış testçiler eklenip App Store'a gitme vakti gelince true
        # yapıp aşağıdaki beta_groups'u açabiliriz.
        submit_to_testflight: false
        # beta_groups:
        #   - "İç Test"

  android-play:
    name: Android — Play (AAB + APK)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      # Codemagic → Team settings → Code signing identities → Android
      # keystores bölümüne bilgisayarındaki release keystore'u (MOBILE_APP.md'de
      # anlatılan neon-yorunge-release.keystore) yükle ve "Reference name"
      # olarak buradakini yaz. Codemagic, şifreleri CM_KEYSTORE_* ortam
      # değişkenleri olarak verir; aşağıda keystore.properties'e yazılır.
      android_signing:
        - beat_orbit_upload
      node: 20.11.1
      java: 21
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web bundles & sync Capacitor Android project
        script: |
          npm run build:ads
          npm run build:3d
          npx cap sync android
      - name: Write keystore.properties
        script: |
          cat > "$CM_BUILD_DIR/android/keystore.properties" <<PROPS
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          PROPS
      - name: Build release AAB and APK
        script: |
          cd android
          chmod +x gradlew
          # versionCode her build'de artmalı (Play aynı numarayı ikinci kez
          # kabul etmez) — Codemagic'in kendi artan sayacı kullanılıyor.
          ./gradlew bundleRelease assembleRelease -PversionCode=$((BUILD_NUMBER + 1))
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - aliaslan625625@gmail.com
        notify:
          success: true
          failure: true
