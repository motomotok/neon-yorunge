workflows:
  ios-testflight:
    name: iOS — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups: []
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.motomotok.neonyorunge"
      node: 20.11.1
      xcode: latest
      cocoapods: default
      # NOT: "ios_signing" bloğu BİLEREK yok — o blok varken Codemagic script'ler
      # hiç çalışmadan ÖNCE kendi otomatik bir sertifika/profil kontrolü
      # yapıyor; bu kontrol var olanı arıyor ama YENİ oluşturmuyor. Hesapta
      # henüz hiç App Store dağıtım sertifikası olmadığı için o otomatik
      # kontrol hep aynı "no matching profiles" hatasıyla anında düşüyor —
      # aşağıdaki scriptler (ki onlar --create ile gerçekten oluşturuyor) hiç
      # çalışma şansı bulamıyordu. İmzalamayı tamamen scriptlere bırakıyoruz.
    integrations:
      # Codemagic panelinde oluşturduğun key'in ADI (Settings -> Integrations
      # -> Developer Portal -> Manage keys -> Active listesindeki "NAME"
      # sütunu) buradakiyle birebir aynı olmalı.
      app_store_connect: "Codemagic CI"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build ads bundle & sync Capacitor iOS project
        script: |
          # www/native-ads-bundle.js ve ios/App/App/public/ ikisi de .gitignore'da
          # (kaynak değil, üretilen dosyalar) — bu yüzden her CI derlemesinde
          # burada YENİDEN üretilmeleri şart, yoksa Xcode eski/boş bir web
          # klasörü paketler.
          npm run build:ads
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Fetch signing files
        script: |
          # Bir önceki denemede eksik olan asıl adım buydu: Apple'da bu bundle
          # ID için App Store dağıtım sertifikası/profili hiç yoktu, bu yüzden
          # aşağıdaki "use-profiles" hiçbir şey bulamıyordu. Bu komut Apple
          # Developer Portal'da (API key'in Admin yetkisiyle) var olanı çeker,
          # yoksa --create ile YENİ sertifika+profil oluşturur.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing certificate
        script: |
          # Bir önceki denemede eksik olan parça: "add-certificates" çağrısından
          # ÖNCE geçici/varsayılan bir keychain oluşturulup kilidi açılmazsa,
          # sertifika hiçbir yere gerçekten kaydedilmiyor ve Xcode imzalama
          # anında sertifikayı bulamıyor — sonuç aynı "no matching profiles"
          # hatasıymış gibi görünüyor.
          keychain initialize
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          # Apple'a yollanan her build'in numarası bir öncekinden büyük olmalı;
          # Codemagic'in kendi otomatik artan sayacını (CM_BUILD_NUMBER)
          # kullanmak ekstra App Store Connect API çağrısı gerektirmiyor,
          # en basit ve güvenilir yöntem.
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $CM_BUILD_NUMBER
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - aliaslan625625@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # İlk birkaç build'de kapalı kalması daha güvenli — hazır olunca
        # true yapıp iPhone 11 / iPad mini'nin bağlı olduğu bir Test
        # Grubu adı ekleyebilirsin (App Store Connect -> TestFlight'ta
        # oluşturulur):
        # beta_groups:
        #   - "İç Test"
